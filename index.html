<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Roda — rede social</title>
<style>
:root{--bg:#f2effa;--card:#fff;--tx:#17142b;--mu:#6f6b85;--bd:#e2ddf2;--ac:#ff5a2e;--ac2:#0fa89a;--me:#17142b;--mt:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#100e1f;--card:#1a1730;--tx:#f1eeff;--mu:#9d99b8;--bd:#2b2749;--me:#ff5a2e;--mt:#fff}}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font:16px/1.45 "Avenir Next","Segoe UI",system-ui,sans-serif;padding-top:env(safe-area-inset-top,0)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--ac2);outline-offset:2px}
.btn{background:#0095f6;color:#fff;padding:.5rem 1rem;border-radius:8px;font-weight:600}.btn:active{opacity:.8}
.btn.ghost{background:var(--bd);color:var(--tx)}.ib{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;color:var(--tx)}.ib:active{opacity:.5}.ic{display:block;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}.liked .ic{fill:#ff3040;stroke:#ff3040}.lk{color:#0095f6;font-weight:700;padding:.5rem}.av.sm{width:28px;height:28px;font-size:.8rem}#mi{border-radius:99px}.end .ic{transform:rotate(135deg)}@keyframes fill{to{width:100%}}
.chip{flex:none;color:var(--tx);background:var(--bd);padding:.35rem .8rem;border-radius:99px;font-size:.85rem;font-weight:600}.chip.on{background:#0095f6;color:#fff}
.stories{display:flex;gap:.8rem;overflow-x:auto;padding:.2rem 0 1rem}.st{display:grid;justify-items:center;gap:.25rem;flex:none;width:68px}.st small{max-width:68px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ring{padding:3px;border-radius:50%;border:3px solid var(--bd);display:block}.ring.on{border-color:transparent;background:linear-gradient(var(--bg),var(--bg)) padding-box,linear-gradient(45deg,#ffb800,#ff3a5e,#b53cd6) border-box}.st .ring .av{width:56px;height:56px}
.call.story{padding:0;justify-content:flex-start;background:#000}.call.story img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.call.story .bars{position:absolute;top:calc(.6rem + env(safe-area-inset-top,0px));left:.6rem;right:.6rem;display:flex;gap:4px;z-index:2}.bars i{flex:1;height:3px;background:#ffffff55;border-radius:2px;overflow:hidden}.bars i.full{background:#fff}.bars b{display:block;height:100%;width:0;background:#fff;animation:fill 5s linear forwards}
.call.story .sh{position:absolute;top:calc(1.4rem + env(safe-area-inset-top,0px));left:.8rem;right:.4rem;color:#fff;z-index:2}.sh .ib{margin-left:auto;color:#fff}
.call.story .sp{position:absolute;top:0;bottom:0;z-index:1}.sp.l{left:0;width:30%}.sp.r{right:0;width:70%}
.call.story .sdel{position:absolute;bottom:calc(1.5rem + env(safe-area-inset-bottom,0px));z-index:2}
.cmt{display:flex;gap:.5rem;align-items:flex-start;margin-bottom:.45rem}.cmt>div{flex:1;min-width:0;word-wrap:break-word}.cmt .x{color:var(--mu);padding:0 .3rem}.cf{display:flex;gap:.3rem;align-items:center;margin-top:.3rem}.cf input{margin:0}.call{overflow-y:auto}.fxs{display:flex;gap:.6rem;overflow-x:auto;width:100%;max-width:560px;padding:.2rem}.fx{flex:none;color:#fff;font-size:.78rem;display:grid;gap:.25rem;justify-items:center}.fx canvas{width:64px;height:64px;object-fit:cover;border-radius:10px;border:2px solid transparent}.fx.on canvas{border-color:#0095f6}.sl{display:grid;gap:.1rem;width:100%;max-width:560px;text-align:left;font-size:.85rem}.sl input{padding:0;border:0;background:none}
input,textarea{width:100%;background:var(--card);border:1.5px solid var(--bd);border-radius:14px;padding:.7rem .9rem}
.auth{min-height:100%;display:grid;place-items:center;padding:1.2rem}
.auth form{width:100%;max-width:380px;display:grid;gap:.8rem}
.logo{font-size:3.4rem;font-weight:900;letter-spacing:-.05em;line-height:1}
.logo i{font-style:normal;color:var(--ac)}
.err{color:var(--ac);font-weight:600;min-height:1.3em}
.app{max-width:640px;margin:0 auto;height:100%;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;padding:.8rem 1rem}
header .logo{font-size:1.7rem}
main{flex:1;overflow-y:auto;padding:0 1rem 1rem}
nav{display:flex;background:var(--card);border-top:1.5px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0)}
nav button{flex:1;padding:.7rem 0;display:grid;place-items:center;color:var(--tx)}
nav button.on .ic{stroke-width:2.8}nav button.on .av{outline:2px solid var(--tx);outline-offset:2px}
.card{background:var(--card);border:1.5px solid var(--bd);border-radius:20px;margin-bottom:1rem;overflow:hidden}
.pad{padding:.9rem}
.who{display:flex;gap:.65rem;align-items:center}
.av{width:42px;height:42px;border-radius:50%;background:var(--ac2);color:#fff;display:grid;place-items:center;font-weight:800;flex:none}
.av.big{width:84px;height:84px;font-size:2rem}
small,.mu{color:var(--mu)}
.media{width:100%;max-height:520px;object-fit:cover;display:block;background:#000}
.acts{display:flex;gap:.2rem;padding:.4rem .5rem 0;align-items:center}
.acts button{color:var(--tx);padding:.4rem;display:grid}

.cm{padding:0 .9rem .7rem;font-size:.92rem}
.cm input{margin-top:.4rem;padding:.5rem .8rem;border-radius:99px}
.row{display:flex;gap:.6rem;align-items:center;justify-content:space-between;padding:.8rem .9rem;border-bottom:1.5px solid var(--bd);width:100%;text-align:left}
.chat{display:flex;flex-direction:column;height:100%}
.chead{display:flex;align-items:center;gap:.6rem;padding:.2rem 0 .8rem}
.chead .sp{flex:1}
.msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:.4rem;padding-bottom:.5rem}
.b{max-width:78%;padding:.55rem .85rem;border-radius:18px;background:var(--card);border:1.5px solid var(--bd);word-wrap:break-word}
.b.me{align-self:flex-end;background:var(--me);color:var(--mt);border-color:transparent}
.send{display:flex;gap:.5rem;padding-top:.5rem}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}
.grid>*{width:100%;aspect-ratio:1;object-fit:cover;background:#000}
.call{position:fixed;inset:0;background:#0b0918;color:#fff;z-index:9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;padding:1.5rem;text-align:center}
.call video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.9}
.call>*:not(video){position:relative}
.call .av{width:110px;height:110px;font-size:2.6rem}
.ctl{display:flex;gap:1rem;position:absolute!important;bottom:calc(2rem + env(safe-area-inset-bottom,0))}
.ctl button{width:62px;height:62px;border-radius:50%;background:#ffffff30;color:#fff;display:grid;place-items:center}.ctl .off{background:#fff;color:#000}
.ctl .end{background:#e5322d}
.empty{text-align:center;padding:2.5rem 1rem;color:var(--mu)}
</style>
</head>
<body>
<div id="root"></div>
<script>
// ---------- Banco local (IndexedDB) ----------
let S={users:[],posts:[],msgs:[]},me=null,view='feed',peer=null,idb;
try{me=localStorage.getItem('roda_me')}catch(e){}
const bc='BroadcastChannel' in window?new BroadcastChannel('roda'):null;
function open(){return new Promise(r=>{const q=indexedDB.open('roda',1);q.onupgradeneeded=()=>q.result.createObjectStore('k');q.onsuccess=()=>{idb=q.result;r()};q.onerror=()=>r()})}
function load(){return new Promise(r=>{if(!idb)return r();const g=idb.transaction('k').objectStore('k').get('s');g.onsuccess=()=>{if(g.result)S=g.result;r()};g.onerror=()=>r()})}
function save(){if(idb)idb.transaction('k','readwrite').objectStore('k').put(S,'s');bc&&bc.postMessage(1)}
if(bc)bc.onmessage=async()=>{await load();const t=document.activeElement;if(t&&t.tagName==='INPUT'&&t.value)return;render()};

// ---------- Utilidades ----------
const $=s=>document.querySelector(s);
const P={home:'<path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z"/>',plane:'<path d="M22 3 15 21l-5.5-6.5L3 9z"/><path d="M22 3 9.5 14.5"/>',plus:'<rect x="3" y="3" width="18" height="18" rx="5"/><path d="M12 8v8M8 12h8"/>',heart:'<path d="M20.8 5.6a5 5 0 0 0-7.1 0L12 7.3l-1.7-1.7a5 5 0 0 0-7.1 7.1L12 21.5l8.8-8.8a5 5 0 0 0 0-7.1z"/>',comment:'<path d="M21 11.5a8.5 8.5 0 0 1-12.2 7.7L3 21l1.8-5.5A8.5 8.5 0 1 1 21 11.5z"/>',phone:'<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/>',video:'<rect x="2" y="6" width="14" height="12" rx="3"/><path d="m16 10 6-3v10l-6-3z"/>',back:'<path d="m15 5-7 7 7 7"/>',mic:'<rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4"/>',image:'<rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="1.5"/><path d="m21 15-5-5L5 21"/>',search:'<circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>',camera:'<path d="M4 8h3l2-3h6l2 3h3v12H4z"/><circle cx="12" cy="13" r="4"/>',flip:'<path d="M3 7h13l-3-3M21 17H8l3 3"/>',trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>'};
const ic=(n,z=25)=>`<svg class="ic" width="${z}" height="${z}" viewBox="0 0 24 24" aria-hidden="true">${P[n]}</svg>`;
const fr=(a,b)=>(S.friends||[]).find(f=>(f.a===a&&f.b===b)||(f.a===b&&f.b===a));
const friendsOf=u=>(S.friends||[]).filter(f=>f.st==='ok'&&(f.a===u||f.b===u)).map(f=>f.a===u?f.b:f.a);
let feedMode=null,fq='',pend=null,profU=null;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const user=u=>S.users.find(x=>x.u===u)||{u,name:u};
const av=(u,c='')=>{const x=user(u);return x.photo?`<div class="av ${c}" style="background:url('${x.photo}') center/cover" role="img" aria-label="${esc(x.name||u)}"></div>`:`<div class="av ${c}" aria-hidden="true">${esc((x.name||u)[0].toUpperCase())}</div>`};
const openCm=new Set();let lastView=null;
function addC(p,inp){const t=inp.value.trim();if(!t)return;p.comments.push({u:me,text:t.slice(0,300),t:Date.now()});openCm.add(p.id);save();render()}
function sq(src){return new Promise(r=>{const i=new Image();i.onload=()=>{const m=Math.min(i.width,i.height),c=document.createElement('canvas');c.width=c.height=400;c.getContext('2d').drawImage(i,(i.width-m)/2,(i.height-m)/2,m,m,0,0,400,400);r(c.toDataURL('image/jpeg',.85))};i.src=src})}
function ago(t){const s=(Date.now()-t)/1000;if(s<60)return'agora';if(s<3600)return Math.floor(s/60)+' min';if(s<86400)return Math.floor(s/3600)+' h';return Math.floor(s/86400)+' d'}
async function hash(p){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('roda'+p));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return btoa(p)}}
function readFile(f){return new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(f)})}
function shrink(url){return new Promise(r=>{const i=new Image();i.onload=()=>{const k=Math.min(1,1000/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.82))};i.src=url})}

// ---------- Conta ----------
let mode='login',err='';
function auth(){
  $('#root').innerHTML=`<div class="auth"><form id="f">
  <div class="logo">roda<i>.</i></div>
  <p class="mu">Poste fotos e vídeos, converse no direct e ligue para quem você segue.</p>
  ${mode==='signup'?'<input id="n" placeholder="Seu nome" autocomplete="name" required>':''}
  <input id="u" placeholder="Usuário (sem espaços)" autocomplete="username" required pattern="[a-zA-Z0-9_.]{3,20}" title="3 a 20 letras, números, _ ou .">
  <input id="p" type="password" placeholder="Senha (mínimo 4)" autocomplete="${mode==='signup'?'new-password':'current-password'}" minlength="4" required>
  <div class="err" role="alert">${esc(err)}</div>
  <button class="btn">${mode==='signup'?'Criar conta':'Entrar'}</button>
  <button type="button" class="btn ghost" id="sw">${mode==='signup'?'Já tenho conta':'Criar uma conta'}</button>
  </form></div>`;
  $('#sw').onclick=()=>{mode=mode==='signup'?'login':'signup';err='';auth()};
  $('#f').onsubmit=async e=>{e.preventDefault();
    const u=$('#u').value.trim().toLowerCase(),p=await hash($('#p').value),ex=S.users.find(x=>x.u===u);
    if(mode==='signup'){
      if(ex){err='Esse usuário já existe. Escolha outro.';return auth()}
      S.users.push({u,p,name:$('#n').value.trim()||u,bio:''});save();
    }else if(!ex||ex.p!==p){err='Usuário ou senha incorretos.';return auth()}
    me=u;err='';try{localStorage.setItem('roda_me',me)}catch(e){}view='feed';render()};
}
function logout(){me=null;peer=null;try{localStorage.removeItem('roda_me')}catch(e){}render()}

// ---------- Telas ----------
function render(){
  if(!me||!S.users.find(x=>x.u===me)){me=null;return auth()}
  const sv=lastView===view&&$('#m')?$('#m').scrollTop:0;lastView=view;
  const tabs=[['feed',ic('home',27),'Início'],['friends',ic('search',27),'Amigos'],['new',ic('plus',27),'Nova publicação'],['direct',ic('plane',27),'Direct'],['me',av(me,'sm'),'Perfil']];
  $('#root').innerHTML=`<div class="app"><header><div class="logo">roda<i>.</i></div><button class="ib" id="hd" aria-label="Direct">${ic('plane')}</button></header>
  <main id="m"></main>
  <nav>${tabs.map(t=>`<button class="${view===t[0]?'on':''}" data-v="${t[0]}" aria-label="${t[2]}">${t[1]}</button>`).join('')}</nav></div>`;
  $('#hd').onclick=()=>{view='direct';peer=null;render()};
  document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{const v=b.dataset.v;peer=null;if(v==='new'){view='feed';render();$('#fi').click();return}view=v;render()});
  ({feed,direct,friends}[view]||profile)();if(sv&&$('#m'))$('#m').scrollTop=sv;
}
function postHTML(p){
  const liked=p.likes.includes(me),cl=p.comments.map((c,i)=>({...c,i})),shown=openCm.has(p.id)?cl:cl.slice(-2);
  return `<article class="card" data-id="${p.id}">
  <button class="pad who" data-a="o" style="width:100%;text-align:left">${av(p.u)}<div><b>${esc(user(p.u).name)}</b><br><small>@${esc(p.u)} · ${ago(p.t)}</small></div></button>
  ${p.type==='video'?`<video class="media" style="filter:${p.vf||'none'}" src="${p.src}" controls playsinline></video>`:`<img class="media" src="${p.src}" alt="Foto de ${esc(p.u)}">`}
  <div class="acts"><button class="${liked?'liked':''}" data-a="like" aria-label="Curtir">${ic('heart')}</button><button data-a="focus" aria-label="Comentar">${ic('comment')}</button><button data-a="go" aria-label="Enviar no direct">${ic('plane')}</button>${p.u===me?`<button data-a="del" style="margin-left:auto" aria-label="Excluir">${ic('trash')}</button>`:''}</div>
  <div class="cm" style="padding-bottom:.3rem"><b>${p.likes.length} curtida${p.likes.length===1?'':'s'}</b></div>
  ${p.cap?`<div class="cm"><b>${esc(p.u)}</b> ${esc(p.cap)}</div>`:''}
  <div class="cm">${cl.length>shown.length?`<button class="lk" data-a="more" style="padding:0 0 .5rem;color:var(--mu);font-weight:600">Ver todos os ${cl.length} comentários</button>`:''}${shown.map(c=>`<div class="cmt">${av(c.u,'sm')}<div><b>${esc(c.u)}</b> ${esc(c.text)} ${c.t?`<small>${ago(c.t)}</small>`:''}</div>${c.u===me||p.u===me?`<button class="x" data-a="dc" data-i="${c.i}" aria-label="Excluir comentário">✕</button>`:''}</div>`).join('')}<div class="cf"><input data-a="cm" placeholder="Adicione um comentário…" aria-label="Comentar" maxlength="300" enterkeyhint="send"><button class="lk" data-a="cs">Publicar</button></div></div></article>`;
}
function bindPosts(){
  document.querySelectorAll('[data-a]').forEach(el=>{
    const id=el.closest('[data-id]')?.dataset.id,p=S.posts.find(x=>x.id==id),a=el.dataset.a;
    if(a==='o')el.onclick=()=>{profU=p.u;view='user';render()};
    if(a==='like')el.onclick=()=>{p.likes=p.likes.includes(me)?p.likes.filter(x=>x!==me):[...p.likes,me];save();render()};
    if(a==='del')el.onclick=()=>{if(confirm('Excluir esta publicação?')){S.posts=S.posts.filter(x=>x!==p);save();render()}};
    if(a==='focus')el.onclick=()=>el.closest('[data-id]').querySelector('[data-a=cm]').focus();
    if(a==='go')el.onclick=()=>{view='direct';peer=null;render()};
    if(a==='cm')el.onkeydown=e=>{if(e.key==='Enter')addC(p,el)};
    if(a==='cs')el.onclick=()=>addC(p,el.closest('article').querySelector('[data-a=cm]'));
    if(a==='more')el.onclick=()=>{openCm.add(p.id);render()};
    if(a==='dc')el.onclick=()=>{p.comments.splice(+el.dataset.i,1);save();render()};
  });
}
function feed(){
  const fl=friendsOf(me);if(!feedMode)feedMode=fl.length?'friends':'all';
  const list=[...S.posts].filter(p=>feedMode==='all'||p.u===me||fl.includes(p.u)).sort((a,b)=>b.t-a.t);
  $('#m').innerHTML=`${storyBar()}<div class="card pad"><textarea id="cap" rows="2" placeholder="O que está rolando?" aria-label="Legenda"></textarea><div id="pv"></div>
  <div style="display:flex;gap:.6rem;margin-top:.6rem;align-items:center;flex-wrap:wrap"><label class="btn ghost" style="cursor:pointer;display:flex;gap:.4rem;align-items:center">${ic('image',20)} Foto ou vídeo<input id="fi" type="file" accept="image/*,video/*" hidden></label><button class="btn ghost" id="cam" style="display:flex;gap:.4rem;align-items:center">${ic('camera',20)} Câmera</button><span id="fn" class="mu" style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></span><button class="btn" id="pub">Publicar</button></div><div class="err" id="fe" role="alert"></div></div>
  <div style="display:flex;gap:.5rem;margin-bottom:1rem"><button class="btn ${feedMode==='friends'?'':'ghost'}" data-m="friends">Amigos</button><button class="btn ${feedMode==='all'?'':'ghost'}" data-m="all">Todos</button></div>
  ${list.length?list.map(postHTML).join(''):`<div class="empty">${feedMode==='friends'?'Ainda não há publicações de amigos. Toque na lupa para adicionar amigos ou veja a aba Todos.':'Nada por aqui ainda. Publique a primeira foto ou vídeo.'}</div>`}`;
  const pvh='class="media" style="margin-top:.6rem;border-radius:12px;max-height:260px"';
  const showPend=()=>{const v=$('#pv');if(!pend){v.innerHTML='';return}
    v.innerHTML=(pend.type==='video'?`<video ${pvh} id="pvv" src="${pend.url}" controls playsinline></video><div class="fxs" id="vf">${FX.map(([n],i)=>`<button class="chip ${(pend.fi||0)===i?'on':''}" data-i="${i}">${n}</button>`).join('')}</div>`:`<img ${pvh} src="${pend.src}" alt="Prévia">`)+`<div>${pend.type==='img'?'<button class="lk" id="ef">Efeitos</button>':''}<button class="lk" id="rp" style="color:var(--mu)">Remover</button></div>`;
    if(pend.type==='img')$('#ef').onclick=()=>editor(pend.raw,r=>{pend.src=r;showPend()});
    else{$('#pvv').style.filter=pend.vf||'';$('#vf').querySelectorAll('.chip').forEach(c=>c.onclick=()=>{const i=+c.dataset.i;pend.fi=i;pend.vf=i?cssf(FX[i][1]):'';$('#pvv').style.filter=pend.vf;$('#vf').querySelectorAll('.chip').forEach(z=>z.classList.toggle('on',z===c))})}
    $('#rp').onclick=()=>{pend=null;showPend()}};
  const got=(raw,i)=>editor(raw,r=>{pend={type:'img',src:r,raw};$('#fe').textContent='';showPend()},i);
  showPend();
  $('#fi').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
    if(f.type.startsWith('video')){if(f.size>40e6){$('#fe').textContent='O vídeo passa de 40 MB. Escolha um menor.';return}pend={type:'video',file:f,url:URL.createObjectURL(f)};$('#fe').textContent='';showPend()}
    else got(await shrink(await readFile(f)))};
  $('#cam').onclick=()=>camera(got);
  $('#pub').onclick=async()=>{
    if(!pend){$('#fe').textContent='Tire uma foto ou escolha uma foto ou vídeo para publicar.';return}
    $('#pub').textContent='Publicando…';
    const vid=pend.type==='video',src=vid?await readFile(pend.file):pend.src;
    S.posts.push({id:Date.now(),u:me,type:vid?'video':'img',src,vf:vid?(pend.vf||''):'',cap:$('#cap').value.trim(),t:Date.now(),likes:[],comments:[]});
    pend=null;save();render()};
  document.querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>b.dataset.st==='new'?newStory():viewStory(b.dataset.st));
  document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{feedMode=b.dataset.m;render()});
  bindPosts();
}
function friends(){
  S.friends=S.friends||[];
  $('#m').innerHTML=`<input id="fs" type="search" placeholder="Buscar qualquer conta por nome ou @usuário" aria-label="Buscar pessoas" value="${esc(fq)}" style="margin-bottom:1rem"><div id="fl"></div>`;
  $('#fs').oninput=e=>{fq=e.target.value;list()};
  const row=(u,btns)=>`<div class="row"><button class="who" data-o="${esc(u.u)}" style="text-align:left">${av(u.u)}<span><b>${esc(u.name)}</b><br><small>@${esc(u.u)}</small></span></button><span style="display:flex;gap:.4rem;flex-wrap:wrap;justify-content:flex-end">${btns}</span></div>`;
  const b=(a,u,t,c='')=>`<button class="btn ${c}" data-f="${a}" data-u="${esc(u)}">${t}</button>`;
  const state=u=>{const f=fr(me,u.u);if(!f)return b('add',u.u,'Adicionar');if(f.st==='ok')return b('msg',u.u,'Mensagem');return f.a===me?b('cancel',u.u,'Pendente','ghost'):b('acc',u.u,'Aceitar')+b('dec',u.u,'Recusar','ghost')};
  const sec=(t,items)=>items.length?`<h3 style="margin:.4rem 0 .5rem">${t}</h3><div class="card">${items.join('')}</div>`:'';
  function list(){
    const q=fq.trim().toLowerCase().replace(/^@/,''),hit=u=>u.u!==me&&(!q||u.u.includes(q)||(u.name||'').toLowerCase().includes(q));
    let h;
    if(q)h=sec('Resultados',S.users.filter(hit).map(u=>row(u,state(u)+(fr(me,u.u)?.st==='ok'?'':b('msg',u.u,'Mensagem','ghost')))));
    else{const inc=S.friends.filter(f=>f.b===me&&f.st==='pending'),sent=S.friends.filter(f=>f.a===me&&f.st==='pending');
      h=sec('Pedidos de amizade',inc.map(f=>row(user(f.a),state(user(f.a)))))
       +sec('Seus amigos',friendsOf(me).map(u=>row(user(u),b('msg',u,'Mensagem')+b('rm',u,'Remover','ghost'))))
       +sec('Pedidos enviados',sent.map(f=>row(user(f.b),state(user(f.b)))))
       +sec('Pessoas que você pode conhecer',S.users.filter(u=>u.u!==me&&!fr(me,u.u)).map(u=>row(u,state(u))))}
    $('#fl').innerHTML=h||'<div class="empty">Ninguém encontrado. Convide pessoas para criar uma conta e busque por elas aqui.</div>';
    $('#fl').querySelectorAll('[data-o]').forEach(el=>el.onclick=()=>{profU=el.dataset.o;view='user';render()});
    $('#fl').querySelectorAll('[data-f]').forEach(el=>el.onclick=()=>{
      const a=el.dataset.f,u=el.dataset.u,f=fr(me,u);
      if(a==='add'&&!f)S.friends.push({a:me,b:u,st:'pending'});
      if(a==='acc'&&f)f.st='ok';
      if((a==='dec'||a==='cancel')&&f)S.friends=S.friends.filter(x=>x!==f);
      if(a==='rm'&&f&&confirm('Remover @'+u+' dos amigos?'))S.friends=S.friends.filter(x=>x!==f);
      if(a==='msg'){view='direct';peer=u;return render()}
      save();list()});
  }
  list();
}
function direct(){
  const m=$('#m');
  if(!peer){
    const fl=friendsOf(me),others=S.users.filter(u=>u.u!==me).sort((a,b)=>fl.includes(b.u)-fl.includes(a.u));
    m.innerHTML=others.length?`<div class="card">${others.map(u=>{
      const last=S.msgs.filter(x=>(x.from===me&&x.to===u.u)||(x.from===u.u&&x.to===me)).pop();
      return `<button class="row" data-p="${esc(u.u)}"><span class="who">${av(u.u)}<span><b>${esc(u.name)}</b><br><small>${last?esc(last.text).slice(0,40):'Toque para conversar'}</small></span></span></button>`}).join('')}</div>`
      :'<div class="empty">Você é o primeiro por aqui. Crie outra conta em outra aba ou convide amigos para conversar no direct.</div>';
    m.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{peer=b.dataset.p;direct()});
    return;
  }
  const list=S.msgs.filter(x=>(x.from===me&&x.to===peer)||(x.from===peer&&x.to===me));
  m.style.display='flex';m.style.flexDirection='column';
  m.innerHTML=`<div class="chat"><div class="chead"><button class="ib" id="bk" aria-label="Voltar">${ic('back')}</button>${av(peer)}<b>${esc(user(peer).name)}</b><span class="sp"></span><button class="ib" id="c1" aria-label="Ligação de voz">${ic('phone')}</button><button class="ib" id="c2" aria-label="Chamada de vídeo">${ic('video')}</button></div>
  <div class="msgs" id="ms">${list.map(x=>`<div class="b ${x.from===me?'me':''}">${esc(x.text)}</div>`).join('')||'<div class="empty">Diga olá 👋</div>'}</div>
  <form class="send" id="sf"><input id="mi" placeholder="Mensagem" autocomplete="off" aria-label="Mensagem"><button class="lk">Enviar</button></form></div>`;
  const ms=$('#ms');ms.scrollTop=ms.scrollHeight;
  $('#bk').onclick=()=>{peer=null;m.style.display='';render()};
  $('#c1').onclick=()=>call(false);$('#c2').onclick=()=>call(true);
  $('#sf').onsubmit=e=>{e.preventDefault();const t=$('#mi').value.trim();if(!t)return;S.msgs.push({from:me,to:peer,text:t,t:Date.now()});save();direct();$('#mi').focus()};
}
function profile(){
  const w=view==='user'&&profU?profU:me,own=w===me,u=user(w),mine=S.posts.filter(p=>p.u===w).sort((a,b)=>b.t-a.t),f=fr(me,w);
  const hasSt=(S.stories||[]).some(x=>x.u===w&&Date.now()-x.t<864e5);
  const act=own?`<div><button class="lk" id="ph">${u.photo?'Trocar foto':'Adicionar foto'}</button>${u.photo?'<button class="lk" id="rph" style="color:var(--mu)">Remover foto</button>':''}</div><textarea id="bio" rows="2" placeholder="Escreva sua bio" style="margin:.7rem 0">${esc(u.bio||'')}</textarea><div style="display:flex;gap:.6rem;justify-content:center"><button class="btn" id="sb">Salvar bio</button><button class="btn ghost" id="lo">Sair</button></div>`
   :`<p style="margin:.5rem 0">${esc(u.bio||'')}</p><div style="display:flex;gap:.6rem;justify-content:center"><button class="btn ${f?'ghost':''}" id="pf">${!f?'Adicionar':f.st==='ok'?'Remover amigo':f.a===me?'Pendente':'Aceitar'}</button><button class="btn ghost" id="pm">Mensagem</button></div>`;
  $('#m').innerHTML=`${own?'':'<button class="lk" id="bk2">← Voltar</button>'}<div class="card pad" style="text-align:center"><div style="display:flex;justify-content:center">${hasSt?`<button class="ring on" id="ps" aria-label="Ver story">${av(w,'big')}</button>`:av(w,'big')}</div><h2 style="margin:.6rem 0 0">${esc(u.name)}</h2><p class="mu">@${esc(w)}</p>${act}
  <p class="mu" style="margin-top:.8rem">${mine.length} publicações · ${friendsOf(w).length} amigos</p></div>
  <div class="grid">${mine.map(p=>p.type==='video'?`<video src="${p.src}" style="filter:${p.vf||'none'}" muted playsinline></video>`:`<img src="${p.src}" alt="">`).join('')}</div>`;
  if(hasSt)$('#ps').onclick=()=>viewStory(w);
  if(own){$('#ph').onclick=()=>camera((raw,i)=>editor(raw,r=>sq(r).then(ph=>{user(me).photo=ph;save();render()}),i));
    if(u.photo)$('#rph').onclick=()=>{delete user(me).photo;save();render()};
    $('#sb').onclick=()=>{user(me).bio=$('#bio').value.trim();save();$('#sb').textContent='Salvo'};$('#lo').onclick=logout}
  else{$('#bk2').onclick=()=>{view='friends';render()};$('#pm').onclick=()=>{view='direct';peer=w;render()};
    $('#pf').onclick=()=>{S.friends=S.friends||[];if(!f)S.friends.push({a:me,b:w,st:'pending'});else if(f.st==='ok'){if(!confirm('Remover @'+w+' dos amigos?'))return;S.friends=S.friends.filter(x=>x!==f)}else if(f.a===me)S.friends=S.friends.filter(x=>x!==f);else f.st='ok';save();render()}}
}
// ---------- Câmera e efeitos ----------
const FX=[['Normal',{}],['Clarendon',{b:1.1,c:1.2,s:1.35,t:[127,187,227,.25]}],['Gingham',{b:1.05,s:.85,sp:.1,t:[230,230,250,.4]}],['Lua',{g:1,c:1.1,b:1.05}],['Sépia',{sp:.9,c:1.05}],['Vintage',{sp:.5,c:.9,b:1.05,s:.8,v:.5}],['Quente',{b:1.05,s:1.2,t:[255,140,60,.4]}],['Frio',{s:1.1,t:[60,130,255,.4]}],['Fade',{b:1.1,c:.8,s:.8}],['Dramático',{c:1.4,s:1.2,b:.9,v:.6}],['Noir',{g:1,c:1.5,b:.95,v:.4}]];
function draw(cv,img,f,k=1,adj=1,max=1000){
  const r=Math.min(1,max/Math.max(img.width,img.height)),w=cv.width=Math.round(img.width*r),h=cv.height=Math.round(img.height*r),x=cv.getContext('2d');
  const v=(a,n=1)=>a==null?n:n+(a-n)*k,B=v(f.b)*adj,C=v(f.c),S=v(f.s),G=v(f.g,0),SP=v(f.sp,0);
  if('filter' in x){x.filter=`brightness(${B}) contrast(${C}) saturate(${S}) grayscale(${G}) sepia(${SP})`;x.drawImage(img,0,0,w,h);x.filter='none'}
  else{x.drawImage(img,0,0,w,h);const d=x.getImageData(0,0,w,h),a=d.data;
    for(let i=0;i<a.length;i+=4){let R=a[i],Gr=a[i+1],Bl=a[i+2],l=.299*R+.587*Gr+.114*Bl;
      R=l+(R-l)*S;Gr=l+(Gr-l)*S;Bl=l+(Bl-l)*S;l=.299*R+.587*Gr+.114*Bl;R+=(l-R)*G;Gr+=(l-Gr)*G;Bl+=(l-Bl)*G;
      if(SP){const a1=.393*R+.769*Gr+.189*Bl,a2=.349*R+.686*Gr+.168*Bl,a3=.272*R+.534*Gr+.131*Bl;R+=(a1-R)*SP;Gr+=(a2-Gr)*SP;Bl+=(a3-Bl)*SP}
      a[i]=(R*B-128)*C+128;a[i+1]=(Gr*B-128)*C+128;a[i+2]=(Bl*B-128)*C+128}
    x.putImageData(d,0,0)}
  if(f.t){x.globalAlpha=Math.min(1,k*f.t[3]);x.globalCompositeOperation='soft-light';x.fillStyle=`rgb(${f.t[0]},${f.t[1]},${f.t[2]})`;x.fillRect(0,0,w,h);x.globalAlpha=1;x.globalCompositeOperation='source-over'}
  if(f.v){const g=x.createRadialGradient(w/2,h/2,Math.min(w,h)*.35,w/2,h/2,Math.max(w,h)*.75);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,`rgba(0,0,0,${f.v*k})`);x.fillStyle=g;x.fillRect(0,0,w,h)}
}
function editor(src,done,start=0){
  const img=new Image();img.onload=()=>{
    let cur=FX[start||0][1],k=1,adj=1;
    const el=document.createElement('div');el.className='call';el.style.justifyContent='flex-start';el.setAttribute('role','dialog');
    el.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;width:100%;max-width:560px"><button class="lk" id="x" style="color:#fff">Cancelar</button><b>Efeitos</b><button class="lk" id="ok">Usar foto</button></div>
    <canvas id="cv" style="max-width:100%;max-height:46vh;border-radius:12px"></canvas>
    <div class="fxs" id="fs"></div>
    <label class="sl">Intensidade<input type="range" id="ki" min="0" max="1" step=".05" value="1"></label>
    <label class="sl">Brilho<input type="range" id="ai" min=".6" max="1.4" step=".05" value="1"></label>`;
    document.body.appendChild(el);
    const cv=el.querySelector('#cv'),rd=()=>draw(cv,img,cur,k,adj,1000);
    FX.forEach(([n,f],i)=>{const b=document.createElement('button');b.className='fx'+(i===(start||0)?' on':'');b.innerHTML=`<canvas></canvas>${n}`;draw(b.firstChild,img,f,1,1,96);
      b.onclick=()=>{cur=f;el.querySelectorAll('.fx').forEach(z=>z.classList.remove('on'));b.classList.add('on');rd()};el.querySelector('#fs').appendChild(b)});
    el.querySelector('#ki').oninput=e=>{k=+e.target.value;rd()};el.querySelector('#ai').oninput=e=>{adj=+e.target.value;rd()};
    el.querySelector('#x').onclick=()=>el.remove();
    el.querySelector('#ok').onclick=()=>{const r=cv.toDataURL('image/jpeg',.85);el.remove();done(r)};
    rd()};
  img.src=src;
}
const cssf=(f,k=1)=>{const v=(a,n=1)=>a==null?n:n+(a-n)*k;return `brightness(${v(f.b)}) contrast(${v(f.c)}) saturate(${v(f.s)}) grayscale(${v(f.g,0)}) sepia(${v(f.sp,0)})`};
async function camera(done){
  let idx=0,st,face='user';
  const el=document.createElement('div');el.className='call';el.setAttribute('role','dialog');
  el.innerHTML=`<video id="cm" autoplay muted playsinline></video><p id="ce" style="position:absolute;top:35%;padding:0 1.5rem"></p><button class="lk" id="cx" style="position:absolute;top:calc(1rem + env(safe-area-inset-top,0px));left:1rem;color:#fff">Fechar</button>
  <div class="fxs" id="lf" style="position:absolute;bottom:calc(8.5rem + env(safe-area-inset-bottom,0px))">${FX.map(([n],i)=>`<button class="chip ${i?'':'on'}" data-i="${i}">${n}</button>`).join('')}</div>
  <div class="ctl"><label class="ib" style="color:#fff;background:#ffffff30;width:62px;height:62px;cursor:pointer" aria-label="Galeria">${ic('image',26)}<input type="file" accept="image/*" hidden id="gl"></label><button id="sh" aria-label="Tirar foto" style="width:78px;height:78px;background:#fff;border:5px solid #ffffff80"></button><button id="fl" aria-label="Virar câmera">${ic('flip',26)}</button></div>`;
  document.body.appendChild(el);
  const v=el.querySelector('#cm'),stop=()=>st&&st.getTracks().forEach(t=>t.stop());
  const start=async()=>{stop();try{st=await navigator.mediaDevices.getUserMedia({video:{facingMode:face},audio:false});v.srcObject=st;v.style.transform=face==='user'?'scaleX(-1)':''}
    catch(e){el.querySelector('#ce').textContent='Permita o acesso à câmera para tirar fotos, ou escolha uma foto da galeria.'}};
  const close=()=>{stop();el.remove()};
  el.querySelectorAll('#lf .chip').forEach(c=>c.onclick=()=>{idx=+c.dataset.i;v.style.filter=idx?cssf(FX[idx][1]):'';el.querySelectorAll('#lf .chip').forEach(z=>z.classList.toggle('on',z===c))});
  el.querySelector('#cx').onclick=close;
  el.querySelector('#fl').onclick=()=>{face=face==='user'?'environment':'user';start()};
  el.querySelector('#gl').onchange=async e=>{const f=e.target.files[0];if(!f)return;const raw=await shrink(await readFile(f));close();done(raw,idx)};
  el.querySelector('#sh').onclick=()=>{if(!v.videoWidth)return;const c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;const x=c.getContext('2d');
    if(face==='user'){x.translate(c.width,0);x.scale(-1,1)}x.drawImage(v,0,0);close();shrink(c.toDataURL('image/jpeg',.92)).then(r=>done(r,idx))};
  start();
}

// ---------- Stories (somem em 24 h) ----------
const liveStories=()=>(S.stories||[]).filter(x=>Date.now()-x.t<864e5);
function storyBar(){
  const fl=friendsOf(me),live=liveStories().filter(x=>x.u===me||feedMode==='all'||fl.includes(x.u));
  const unseen=u=>live.some(x=>x.u===u&&!(x.seen||[]).includes(me));
  const users=[...new Set(live.map(x=>x.u))].sort((a,b)=>(a===me?-1:b===me?1:unseen(b)-unseen(a)));
  return `<div class="stories"><button class="st" data-st="new" aria-label="Novo story"><span class="ring"><span class="av" style="background:var(--bd);color:var(--tx)">${ic('plus',24)}</span></span><small>Novo story</small></button>`
   +users.map(u=>`<button class="st" data-st="${esc(u)}" aria-label="Story de ${esc(user(u).name)}"><span class="ring ${unseen(u)?'on':''}">${av(u)}</span><small>${u===me?'Seu story':esc(user(u).name)}</small></button>`).join('')+'</div>';
}
function newStory(){
  camera((raw,i)=>editor(raw,r=>{S.stories=S.stories||[];S.stories.push({id:Date.now(),u:me,src:r,t:Date.now(),seen:[me]});save();render()},i));
}
function viewStory(u){
  const list=liveStories().filter(x=>x.u===u).sort((a,b)=>a.t-b.t);if(!list.length)return;
  let i=Math.max(0,list.findIndex(x=>!(x.seen||[]).includes(me))),tm;
  const el=document.createElement('div');el.className='call story';el.setAttribute('role','dialog');document.body.appendChild(el);
  const close=()=>{clearTimeout(tm);el.remove();render()};
  const next=()=>{i++;i>=list.length?close():show()},prev=()=>{i=Math.max(0,i-1);show()};
  function show(){clearTimeout(tm);const s=list[i];if(!(s.seen=s.seen||[]).includes(me)){s.seen.push(me);save()}
    el.innerHTML=`<img src="${s.src}" alt="Story de ${esc(user(u).name)}"><div class="bars">${list.map((_,j)=>`<i class="${j<i?'full':''}">${j===i?'<b></b>':''}</i>`).join('')}</div>
    <div class="who sh">${av(u)}<span><b>${esc(user(u).name)}</b> <small style="color:#ffffffb0">${ago(s.t)}</small></span><button class="ib" id="sx" aria-label="Fechar">✕</button></div>
    <button class="sp l" aria-label="Anterior"></button><button class="sp r" aria-label="Próximo"></button>${u===me?'<button class="btn ghost sdel">Excluir story</button>':''}`;
    el.querySelector('.l').onclick=prev;el.querySelector('.r').onclick=next;el.querySelector('#sx').onclick=close;
    const d=el.querySelector('.sdel');if(d)d.onclick=()=>{S.stories=S.stories.filter(x=>x.id!==s.id);save();close()};
    tm=setTimeout(next,5000)}
  show();
}

// ---------- Ligações// ---------- Ligações (câmera e microfone reais do aparelho) ----------
let stream,timer;
async function call(withVideo){
  const el=document.createElement('div');el.className='call';el.setAttribute('role','dialog');
  el.innerHTML=`<video id="lv" autoplay muted playsinline hidden></video>${av(peer)}<h2>${esc(user(peer).name)}</h2><p id="st">Chamando…</p>
  <div class="ctl"><button id="mu" aria-label="Mudo">${ic('mic',26)}</button>${withVideo?`<button id="cv" aria-label="Câmera">${ic('video',26)}</button>`:''}<button class="end" id="en" aria-label="Desligar">${ic('phone',26)}</button></div>`;
  document.body.appendChild(el);
  try{stream=await navigator.mediaDevices.getUserMedia({audio:true,video:withVideo});
    if(withVideo){const v=el.querySelector('#lv');v.hidden=false;v.srcObject=stream}
  }catch(e){$('#st').textContent='Permita o acesso ao microfone'+(withVideo?' e à câmera':'')+' para ligar.'}
  let s=0;const t1=setTimeout(()=>{if(!stream)return;timer=setInterval(()=>{s++;const st=$('#st');if(st)st.textContent='Em ligação · '+String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')},1000);$('#st').textContent='Em ligação · 00:00'},2200);
  const end=()=>{clearTimeout(t1);clearInterval(timer);stream&&stream.getTracks().forEach(t=>t.stop());stream=null;el.remove()};
  el.querySelector('#en').onclick=end;
  el.querySelector('#mu').onclick=e=>{if(!stream)return;const a=stream.getAudioTracks()[0];if(a){a.enabled=!a.enabled;e.currentTarget.classList.toggle('off',!a.enabled)}};
  const cv=el.querySelector('#cv');if(cv)cv.onclick=()=>{const v=stream&&stream.getVideoTracks()[0];if(v){v.enabled=!v.enabled;cv.classList.toggle('off',!v.enabled)}};
}

open().then(load).then(()=>render());
